<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyNest · DRAXIL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">📚</span>
        <div>
          <div class="brand-name">StudyNest</div>
          <div class="brand-tag">Powered by DRAXIL 🤖</div>
        </div>
      </div>

      <nav class="nav">
        <a href="#/home"      data-route="home">🏠 Dashboard</a>
        <a href="#/library"   data-route="library">📁 Library</a>
        <a href="#/workspace" data-route="workspace">🧩 Workspace</a>
        <a href="#/planner"   data-route="planner">📅 Planner</a>
        <a href="#/progress"  data-route="progress">📈 Progress</a>
      </nav>

      <div class="sidebar-foot">🔒 Your files stay on this device</div>
    </aside>

    <div class="content">
      <header class="topbar">
        <h1 id="page-title">🏠 Dashboard</h1>
        <div class="user-chip">👤 Guest</div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
